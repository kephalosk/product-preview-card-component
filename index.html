<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
        <title>Product Preview Card Component | by kephalosk</title>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/styles.css">
    </head>
    <body>
        <main id="app">
            <section class="card">
                <picture>
                    <source srcset="assets/images/image-product-desktop.jpg" media="(min-width: 600px)">
                    <img class="cardImage" src="assets/images/image-product-mobile.jpg" alt="product image" aria-hidden="true"/>
                </picture>
                <div class="cardContent">
                    <header class="cardContentHeader">
                        <label class="cardContentHeaderCategory">Perfume</label>
                        <h1 class="cardContentHeaderTitle">Gabrielle Essence Eau De Parfum</h1>
                        <p class="cardContentHeaderText">
                            A floral, solar and voluptuous interpretation composed by Olivier Polge,
                            Perfumer-Creator for the House of CHANEL.
                        </p>
                    </header>
                    <div class="cardContentPriceBar">
                        <label class="cardContentPriceBarCurrent">$149.99</label>
                        <label class="cardContentPriceBarOld">$169.99</label>
                    </div>
                    <button class="cardContentButton">
                        <img class="cardContentButtonIcon" src="assets/images/icon-cart.svg" alt="cart icon" aria-hidden="true"/>
                        Add to Cart
                    </button>
                </div>
            </section>
        </main>
        <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
            Coded by <a href="https://github.com/kephalosk">kephalosk</a>.
        </footer>
    </body>
</html>
